spring:
  datasource:
    url: jdbc:h2:file:./data/fuelprice
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

mimit:
  carburanti:
    stations-url: "https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv"
    prices-url: "https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv"
